[package]
name = "gpui_android"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Native Android backend for Holool GPUI Fast"
repository = "https://github.com/holool/gpui_android"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
gpui = { git = "https://github.com/holool/gpui-fast", rev = "c1d2067ce521826a138f7d9d4fe94299b83ff267", default-features = false }
gpui_wgpu = { git = "https://github.com/holool/gpui-fast", rev = "c1d2067ce521826a138f7d9d4fe94299b83ff267", default-features = false }
anyhow = "1"
futures = "0.3"
jni = "0.21"
ndk = "0.9"
parking_lot = "0.12"
raw-window-handle = "0.6"
log = "0.4"
android_logger = "0.15"

[workspace]
members = ["examples/minimal"]
resolver = "2"
