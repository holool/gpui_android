name: Android
on: [push, pull_request, workflow_dispatch]
jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: cargo fmt --all --check && cargo test --locked -p gpui_android --lib
      - run: scripts/build-android.sh
        env:
          CARGO_BUILD_JOBS: '4'
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-android-arm64-debug
          path: examples/minimal/android/app/build/outputs/apk/debug/app-debug.apk
